<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1c"><title>KARY STORE — товары</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#090d1c;--p:#141d32;--line:#2a3858;--txt:#f4f6ff;--muted:#91a0c0;--blue:#438cff;--violet:#9864ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#38236a55,transparent 40%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{font-size:20px;font-weight:950;letter-spacing:1.4px}.brand b{color:#9b7cff}.sub{color:var(--muted);font-size:11px;margin-top:4px}.pill{border:1px solid #31527b;background:#122442;color:#8fc1ff;border-radius:30px;padding:7px 10px;font-size:11px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:linear-gradient(145deg,#151e35,#101729);border:1px solid var(--line);border-radius:15px;padding:12px}.stat strong{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:8px;margin:12px 0}.field{width:100%;background:#0c1325;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;outline:none}.field:focus{border-color:#8267ff;box-shadow:0 0 0 3px #8267ff20}.search{flex:1;min-width:0}.btn{border-radius:12px;padding:12px 14px;font-weight:850;background:linear-gradient(110deg,var(--blue),var(--violet));color:white;box-shadow:0 6px 18px #5d63e633}.btn.secondary{background:#202b45;box-shadow:none;border:1px solid var(--line)}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;background:linear-gradient(145deg,#141d32,#101729);border:1px solid var(--line);border-radius:16px;padding:10px}.thumb{width:64px;height:64px;border-radius:11px;object-fit:cover;background:#202a43;flex-shrink:0}.main{min-width:0;flex:1}.name{font-weight:850;line-height:1.3;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:5px}.price{font-weight:900;color:#b9a4ff;margin-top:4px}.edit{background:#24365a;color:#dce9ff;border:1px solid #3a5688;border-radius:10px;padding:9px 11px;font-weight:800}.green{color:#4cdda6}.red{color:#ff9eaa}.empty,.loading{text-align:center;color:var(--muted);padding:30px 10px}.modal{position:fixed;inset:0;background:#050816df;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:10px}.modal.show{display:flex}.sheet{width:min(100%,700px);max-height:94vh;overflow:auto;background:#111a2e;border:1px solid #344365;border-radius:22px;padding:17px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 80px #0009}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet h2{font-size:18px;margin:0}.x{background:#27324b;color:#fff;border-radius:10px;padding:8px 11px}.group{margin:12px 0}.group label{display:block;color:#aebbd6;font-size:11px;font-weight:800;margin:0 0 7px}.area{min-height:105px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.preview{width:100%;height:145px;object-fit:contain;background:#0a1020;border:1px dashed #405071;border-radius:13px;margin-top:8px}.check{display:flex;align-items:center;gap:9px;color:#d8e0f4;font-size:13px}.check input{width:18px;height:18px;accent-color:#8a6cff}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#253958;border:1px solid #526c9b;border-radius:13px;padding:11px 15px;z-index:10;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 14px}.tab{background:#121d33;border:1px solid var(--line);color:var(--muted);padding:11px 5px;border-radius:12px;font-weight:850;font-size:12px}.tab.active{background:linear-gradient(110deg,#285da8,#704bd0);border-color:#7b73e8;color:white}.panel-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}.client-card,.ticket-card,.chat-card{background:linear-gradient(145deg,#141d32,#101729);border:1px solid var(--line);border-radius:15px;padding:13px}.client-top,.ticket-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.client-id{font-size:17px;font-weight:950;color:#bba7ff}.client-meta,.ticket-meta{color:var(--muted);font-size:11px;line-height:1.7;margin-top:7px;overflow-wrap:anywhere}.client-balance{font-weight:900;color:#a8c6ff}.credit-row{display:flex;gap:7px;margin-top:10px}.credit-row input{min-width:0;flex:1}.credit-row button{white-space:nowrap}.ticket-card{cursor:pointer}.ticket-preview{color:#c4cee2;font-size:11px;line-height:1.5;margin-top:8px;white-space:pre-wrap}.chat-list{display:grid;gap:8px;margin:12px 0;max-height:55vh;overflow:auto}.chat-msg{max-width:90%;padding:10px 12px;border-radius:13px;background:#202d48;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.chat-msg.customer{justify-self:start;background:#1a3150}.chat-msg.admin{justify-self:end;background:#3a2e63}.chat-msg small{display:block;color:#a5b2ce;font-size:9px;margin-top:5px}.chat-compose{display:grid;gap:8px}.chat-compose textarea{min-height:78px;resize:vertical}.ticket-actions{display:flex;gap:8px;margin-top:10px}.ticket-actions>*{flex:1}@media(min-width:600px){.modal{align-items:center}.sheet{max-height:88vh}.thumb{width:76px;height:76px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="brand">KARY <b>STORE</b></div><div class="sub">Панель управления каталогом</div></div><span class="pill">● ADMIN</span></header><div class="stats"><div class="stat"><strong id="total">—</strong><span>Всего товаров</span></div><div class="stat"><strong id="active">—</strong><span>Опубликовано</span></div><div class="stat"><strong id="cats">—</strong><span>Категорий</span></div></div><nav class="tabs"><button class="tab active" data-tab="products">📦 Товары</button><button class="tab" data-tab="support">🆘 Поддержка</button><button class="tab" data-tab="customers">👥 Клиенты</button></nav><section id="productsPanel"><div class="toolbar"><input id="search" class="field search" placeholder="Поиск товара…"><button class="btn" id="add">＋ Добавить</button></div><div id="list" class="list"><div class="loading">Загружаем каталог…</div></div></section><section id="supportPanel" hidden><div class="panel-head"><b>Обращения клиентов</b><button class="btn secondary" id="refreshSupport">Обновить</button></div><div id="supportContent" class="list"><div class="loading">Загружаем обращения…</div></div></section><section id="customersPanel" hidden><div class="panel-head"><b>Клиенты KARY STORE</b><button class="btn secondary" id="refreshCustomers">Обновить</button></div><input id="customerSearch" class="field" placeholder="Поиск по ID, имени, телефону или Telegram…"><div id="customersContent" class="list" style="margin-top:10px"><div class="loading">Загружаем клиентов…</div></div></section></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="formTitle">Новый товар</h2><button class="x" id="close">✕</button></div><form id="form"><input type="hidden" id="pid"><div class="group"><label>Название товара</label><input class="field" id="name" required maxlength="180" placeholder="Название"></div><div class="group"><label>Описание</label><textarea class="field area" id="description" placeholder="Подробное описание товара"></textarea></div><div class="two"><div class="group"><label>Цена, ₽</label><input class="field" id="price" type="number" min="0" step=".01" required></div><div class="group"><label>Старая цена, ₽</label><input class="field" id="oldPrice" type="number" min="0" step=".01" placeholder="Необязательно"></div></div><div class="group"><label>Категория</label><select class="field" id="category" required></select></div><div class="group"><label>Фотография товара</label><input class="field" id="photo" type="file" accept="image/jpeg,image/png,image/webp"><input class="field" id="imageUrl" placeholder="Или ссылка на фото" style="margin-top:8px"><img id="preview" class="preview" alt="Предпросмотр" hidden></div><div class="group"><label class="check"><input id="published" type="checkbox" checked> Показывать товар в магазине</label></div><div class="actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button type="submit" class="btn" id="save">Сохранить</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API="https://krdhfzbinbxyketfcrdg.supabase.co/functions/v1/kary-miniapp-admin";const initData=tg?.initData||"";let products=[],categories=[],selectedFile=null;const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)}
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData,action,...extra})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Ошибка запроса");return j}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function catName(id){return categories.find(c=>+c.id===+id)?.name||"Без категории"}
function render(){let q=$("search").value.toLowerCase().trim(),arr=products.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q));$("total").textContent=products.length;$("active").textContent=products.filter(p=>p.is_active).length;$("cats").textContent=categories.length;$("list").innerHTML=arr.length?arr.map(p=>'<article class="item"><img class="thumb" src="'+esc(p.image_url||"")+'" onerror="this.style.visibility=\'hidden\'" alt=""><div class="main"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(catName(p.category_id))+' · <span class="'+(p.is_active?"green":"red")+'">'+(p.is_active?"Опубликован":"Скрыт")+'</span></div><div class="price">'+Number(p.price).toLocaleString("ru-RU")+' ₽</div></div><button class="edit" data-edit="'+p.id+'">Изменить</button></article>').join(""):'<div class="empty">Ничего не найдено</div>'}
function openForm(p=null){$("formTitle").textContent=p?"Редактирование товара #"+p.id:"Новый товар";$("pid").value=p?.id||"";$("name").value=p?.name||"";$("description").value=p?.description||"";$("price").value=p?.price??"";$("oldPrice").value=p?.original_price??"";$("category").innerHTML=categories.filter(c=>c.is_active).map(c=>'<option value="'+c.id+'">'+esc(c.icon+" "+c.name)+'</option>').join("");$("category").value=p?.category_id||categories.find(c=>c.is_active)?.id||"";$("imageUrl").value=p?.image_url||"";$("published").checked=p?.is_active??true;$("photo").value="";selectedFile=null;$("preview").hidden=!p?.image_url;$("preview").src=p?.image_url||"";$("modal").classList.add("show")}
function closeForm(){$("modal").classList.remove("show")}
$("list").addEventListener("click",e=>{let b=e.target.closest("[data-edit]");if(b)openForm(products.find(p=>String(p.id)===b.dataset.edit))});$("add").onclick=()=>openForm();$("close").onclick=$("cancel").onclick=closeForm;$("search").oninput=render;
$("photo").onchange=()=>{selectedFile=$("photo").files[0]||null;if(selectedFile){$("preview").src=URL.createObjectURL(selectedFile);$("preview").hidden=false}};$("imageUrl").oninput=()=>{if(!$("photo").files.length&&$("imageUrl").value){$("preview").src=$("imageUrl").value;$("preview").hidden=false}};
function fileData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$("form").onsubmit=async e=>{e.preventDefault();let b=$("save");b.disabled=true;b.textContent="Сохраняем…";try{let p={id:$("pid").value||null,name:$("name").value,description:$("description").value,price:$("price").value,original_price:$("oldPrice").value||null,category_id:$("category").value,image_url:$("imageUrl").value,is_active:$("published").checked};if(selectedFile)p.image_data=await fileData(selectedFile);await call("save",{product:p});closeForm();await load();toast("Изменения сохранены ✓")}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent="Сохранить"}};
async function load(){try{let d=await call("list");products=d.products||[];categories=d.categories||[];render()}catch(e){$("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>';toast(e.message)}}load();
let currentTab="products",currentTicket=null,allCustomers=[];
function setTab(tab){currentTab=tab;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("productsPanel").hidden=tab!=="products";$("supportPanel").hidden=tab!=="support";$("customersPanel").hidden=tab!=="customers";if(tab==="support")loadSupport();if(tab==="customers")loadCustomers()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
async function loadSupport(){const box=$("supportContent");box.innerHTML='<div class="loading">Загружаем обращения…</div>';try{const d=await call("support_list");const tickets=d.tickets||[];if(!tickets.length){box.innerHTML='<div class="empty">Обращений пока нет</div>';return}box.innerHTML=tickets.map(t=>'<article class="ticket-card" data-ticket="'+esc(t.id)+'"><div class="ticket-top"><b>'+esc(t.customer_label||"Посетитель")+'</b><span class="'+(t.status==="open"?"green":"red")+'">'+(t.status==="open"?"Открыто":"Закрыто")+'</span></div><div class="ticket-meta">ID сайта: '+(t.customer_number?"#"+esc(t.customer_number):"не зарегистрирован")+'<br>Телефон: '+esc(t.customer_phone||"не указан")+'<br>Telegram: '+esc(t.customer_telegram_username||"не привязан")+'<br>Обращение: '+esc(String(t.id).slice(0,8))+' · '+new Date(t.updated_at||t.created_at).toLocaleString("ru-RU")+'</div><div class="ticket-preview">Нажми, чтобы открыть переписку</div></article>').join("");}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async async function openTicket(id){currentTicket=id;const box=$("supportContent");box.innerHTML='<div class="loading">Загружаем переписку…</div>';try{const d=await call("support_messages",{id});const msgs=d.messages||[];box.innerHTML='<button class="btn secondary" id="backTickets">← Все обращения</button><div class="chat-list">'+(msgs.length?msgs.map(m=>'<div class="chat-msg '+(m.sender==="admin"?"admin":"customer")+'">'+esc(m.body)+'<small>'+(m.sender==="admin"?"Вы":"Клиент")+" · "+new Date(m.created_at).toLocaleString("ru-RU")+'</small></div>').join(""):'<div class="empty">Сообщений пока нет</div>')+'</div><div class="chat-compose"><textarea id="supportReply" class="field" placeholder="Напишите ответ клиенту…"></textarea><div class="ticket-actions"><button class="btn" id="sendSupportReply">Отправить ответ</button><button class="btn secondary" id="closeSupportTicket">Закрыть обращение</button></div></div>'; $("backTickets").onclick=loadSupport;$("sendSupportReply").onclick=async()=>{const message=$("supportReply").value.trim();if(!message)return toast("Введите текст ответа");const b=$("sendSupportReply");b.disabled=true;try{await call("support_reply",{id,message});toast("Ответ отправлен клиенту");await openTicket(id)}catch(e){toast(e.message)}finally{b.disabled=false}};$("closeSupportTicket").onclick=async()=>{try{await call("support_close",{id});toast("Обращение закрыто");await loadSupport()}catch(e){toast(e.message)}};}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$("supportContent").addEventListener("click",e=>{const card=e.target.closest("[data-ticket]");if(card)openTicket(card.dataset.ticket)});$("refreshSupport").onclick=loadSupport;
async function loadCustomers(){const box=$("customersContent");box.innerHTML='<div class="loading">Загружаем клиентов…</div>';try{const d=await call("customers_list");allCustomers=d.customers||[];renderCustomers()}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderCustomers(){const q=$("customerSearch").value.trim().toLowerCase();const list=allCustomers.filter(u=>[u.customer_number,u.full_name,u.phone,u.telegram_username].join(" ").toLowerCase().includes(q));$("customersContent").innerHTML=list.length?list.map(u=>'<article class="client-card"><div class="client-top"><span class="client-id">Клиент #'+esc(u.customer_number)+'</span><span class="client-balance">'+Number(u.balance||0).toLocaleString("ru-RU")+' ₽</span></div><div class="client-meta">'+esc(u.full_name||"Имя не указано")+'<br>Телефон: '+esc(u.phone)+'<br>Telegram: '+esc(u.telegram_username||"не указан")+'<br>Регистрация: '+new Date(u.created_at).toLocaleDateString("ru-RU")+'</div><div class="credit-row"><input class="field" type="number" min="1" step="1" placeholder="Сумма пополнения, ₽" data-credit-amount="'+esc(u.customer_number)+'"><button class="btn" data-credit="'+esc(u.customer_number)+'">＋ Баланс</button></div></article>').join(""):'<div class="empty">Клиенты не найдены</div>'}
$("customerSearch").oninput=renderCustomers;$("refreshCustomers").onclick=loadCustomers;
$("customersContent").addEventListener("click",async e=>{const b=e.target.closest("[data-credit]");if(!b)return;const id=b.dataset.credit,input=document.querySelector("[data-credit-amount='"+id+"']"),amount=Number(input?.value);if(!Number.isFinite(amount)||amount<=0)return toast("Укажите сумму пополнения");b.disabled=true;try{const d=await call("customer_credit",{customer_number:Number(id),amount});toast("Баланс клиента #"+id+" пополнен. Новый баланс: "+Number(d.customer.new_balance).toLocaleString("ru-RU")+" ₽");await loadCustomers()}catch(err){toast(err.message)}finally{b.disabled=false}});

</script></body></html>
