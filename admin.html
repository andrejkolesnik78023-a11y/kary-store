<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1c"><title>KARY STORE — товары</title><script src="https://telegram.org/js/telegram-web-app.js">
(function(){
 const style=document.createElement("style");
 style.textContent=".filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}.bulk{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}.bulk .btn{padding:9px 11px;font-size:12px}.pick{width:18px;height:18px;accent-color:#8a6cff;flex-shrink:0}.catrow{display:flex;gap:8px;align-items:center;padding:10px;background:#0d1528;border:1px solid var(--line);border-radius:12px;margin:7px 0}.catrow .main{flex:1}.danger{background:#4a2435;color:#ffb3c0;border:1px solid #71374d;border-radius:10px;padding:9px 11px;font-weight:800}";
 document.head.appendChild(style);
 const toolbar=document.querySelector(".toolbar");
 const catsBtn=document.createElement("button");catsBtn.className="btn secondary";catsBtn.textContent="📁";catsBtn.id="manageCats";toolbar.appendChild(catsBtn);
 const filters=document.createElement("div");filters.className="filters";filters.innerHTML='<select id="filterCat" class="field"><option value="">Все категории</option></select><select id="filterStatus" class="field"><option value="">Все статусы</option><option value="active">Опубликованные</option><option value="hidden">Скрытые</option></select>';
 document.querySelector("#list").before(filters);
 const bulkBar=document.createElement("div");bulkBar.className="bulk";bulkBar.innerHTML='<label class="check"><input id="selectAll" type="checkbox"> Выбрать все</label><button class="btn secondary" id="bulkPublish">Опубликовать</button><button class="btn secondary" id="bulkHide">Скрыть</button><button class="danger" id="bulkDelete">Удалить выбранные</button><span class="meta" id="selectedCount">Выбрано: 0</span>';
 filters.after(bulkBar);
 const catModal=document.createElement("div");catModal.className="modal";catModal.id="catModal";catModal.innerHTML='<div class="sheet"><div class="sheethead"><h2>Управление категориями</h2><button class="x" id="closeCats">✕</button></div><div class="group"><label>Новая категория</label><div class="two"><input class="field" id="newCatName" placeholder="Название"><input class="field" id="newCatIcon" placeholder="Иконка" value="📦"></div><button class="btn" id="createCat" style="width:100%;margin-top:8px">＋ Создать категорию</button></div><div id="catList"></div></div>';
 document.body.appendChild(catModal);
 const deleteBtn=document.createElement("button");deleteBtn.type="button";deleteBtn.className="danger";deleteBtn.id="deleteProduct";deleteBtn.textContent="Удалить товар";deleteBtn.style.display="none";
 document.querySelector(".actions").prepend(deleteBtn);
 const clearWrap=document.createElement("label");clearWrap.className="check";clearWrap.style.marginTop="9px";clearWrap.innerHTML='<input id="clearPhoto" type="checkbox"> Удалить текущее фото';
 document.querySelector("#preview").after(clearWrap);
 let selected=new Set(),catFilter="",statusFilter="";
 const baseRender=render;
 render=function(){
   const original=products;
   const q=$("search").value.toLowerCase().trim();
   catFilter=$("filterCat").value;statusFilter=$("filterStatus").value;
   products=original.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q)&&(!catFilter||String(p.category_id)===catFilter)&&(!statusFilter||(statusFilter==="active"?p.is_active:!p.is_active)));
   $("filterCat").innerHTML='<option value="">Все категории</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc((c.icon||"")+" "+c.name)+'</option>').join("");
   $("filterCat").value=catFilter;$("filterStatus").value=statusFilter;
   baseRender();products=original;$("total").textContent=original.length;$("active").textContent=original.filter(p=>p.is_active).length;$("cats").textContent=categories.length;
   document.querySelectorAll("#list .item").forEach(el=>{
     const b=el.querySelector("[data-edit]");if(!b)return;
     const id=b.getAttribute("data-edit"),cb=document.createElement("input");cb.type="checkbox";cb.className="pick";cb.checked=selected.has(id);cb.addEventListener("change",()=>{cb.checked?selected.add(id):selected.delete(id);updateSelected()});el.prepend(cb);
   });
   updateSelected();
 };
 function updateSelected(){ $("selectedCount").textContent="Выбрано: "+selected.size;$("selectAll").checked=products.length>0&&products.every(p=>selected.has(String(p.id))); }
 $("filterCat").addEventListener("change",()=>{catFilter=$("filterCat").value;render()});
 $("filterStatus").addEventListener("change",()=>{statusFilter=$("filterStatus").value;render()});
 $("selectAll").onchange=()=>{products.forEach(p=>$("selectAll").checked?selected.add(String(p.id)):selected.delete(String(p.id)));render()};
 async function bulk(mode){if(!selected.size)return toast("Сначала выбери товары.");if(mode==="delete"&&!confirm("Удалить выбранные товары без возможности восстановления?"))return;try{await call("bulk_products",{ids:Array.from(selected).map(Number),mode});selected.clear();await load();toast("Готово ✓")}catch(e){toast(e.message)}}
 $("bulkPublish").onclick=()=>bulk("publish");$("bulkHide").onclick=()=>bulk("hide");$("bulkDelete").onclick=()=>bulk("delete");
 function renderCats(){
   $("catList").innerHTML=categories.map(c=>'<div class="catrow"><div class="main"><b>'+esc((c.icon||"")+" "+c.name)+'</b><div class="meta">'+products.filter(p=>+p.category_id===+c.id).length+' товаров · '+(c.is_active?"Активна":"Скрыта")+'</div></div><button class="edit" data-cat-toggle="'+c.id+'">'+(c.is_active?'Скрыть':'Включить')+'</button><button class="edit" data-cat-edit="'+c.id+'">Изменить</button><button class="danger" data-cat-del="'+c.id+'">✕</button></div>').join("")||'<div class="empty">Категорий пока нет</div>';
 }
 catsBtn.onclick=()=>{renderCats();catModal.classList.add("show")};$("closeCats").onclick=()=>catModal.classList.remove("show");
 $("catList").onclick=async e=>{
   const toggle=e.target.closest("[data-cat-toggle]"),edit=e.target.closest("[data-cat-edit]"),del=e.target.closest("[data-cat-del]");if(toggle){const c=categories.find(x=>String(x.id)===toggle.dataset.catToggle);try{await call("category_save",{category:{id:c.id,name:c.name,icon:c.icon,is_active:!c.is_active}});await load();renderCats();toast(c.is_active?"Категория скрыта":"Категория включена")}catch(err){toast(err.message)}}
   if(edit){const c=categories.find(x=>String(x.id)===edit.dataset.catEdit),name=prompt("Название категории:",c.name);if(name===null)return;const icon=prompt("Иконка категории:",c.icon||"📦");if(icon===null)return;try{await call("category_save",{category:{id:c.id,name,icon,is_active:c.is_active}});await load();renderCats();toast("Категория обновлена")}catch(err){toast(err.message)}}
   if(del){const c=categories.find(x=>String(x.id)===del.dataset.catDel);if(!confirm('Удалить категорию "'+c.name+'"?'))return;try{await call("category_delete",{id:c.id});await load();renderCats();toast("Категория удалена")}catch(err){toast(err.message)}}
 };
 $("createCat").onclick=async()=>{const name=$("newCatName").value.trim(),icon=$("newCatIcon").value.trim()||"📦";if(!name)return toast("Введи название категории.");try{await call("category_save",{category:{name,icon,is_active:true}});$("newCatName").value="";await load();renderCats();toast("Категория создана")}catch(e){toast(e.message)}};
 const oldOpen=openForm;
 openForm=function(p){oldOpen(p);$("deleteProduct").style.display=p?"block":"none";$("clearPhoto").checked=false;};
 $("deleteProduct").onclick=async()=>{const id=Number($("pid").value);if(!id||!confirm("Точно удалить этот товар?"))return;try{await call("delete_product",{id});selected.delete(String(id));closeForm();await load();toast("Товар удалён")}catch(e){toast(e.message)}};
 const oldSubmit=$("form").onsubmit;
 $("form").addEventListener("submit",function(e){
   if(!$("clearPhoto").checked)return;
   const hidden=$("imageUrl");hidden.dataset.old=hidden.value;hidden.value="";
   setTimeout(()=>{if(hidden.dataset.old!==undefined){hidden.value=hidden.dataset.old;delete hidden.dataset.old}},1000);
 });
 const oldLoad=load;
 load=async function(){await oldLoad();renderCats();};
 const oldRenderCall=render; 
})();

</script><style>
:root{color-scheme:dark;--bg:#090d1c;--p:#141d32;--line:#2a3858;--txt:#f4f6ff;--muted:#91a0c0;--blue:#438cff;--violet:#9864ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#38236a55,transparent 40%),var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{font-size:20px;font-weight:950;letter-spacing:1.4px}.brand b{color:#9b7cff}.sub{color:var(--muted);font-size:11px;margin-top:4px}.pill{border:1px solid #31527b;background:#122442;color:#8fc1ff;border-radius:30px;padding:7px 10px;font-size:11px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:linear-gradient(145deg,#151e35,#101729);border:1px solid var(--line);border-radius:15px;padding:12px}.stat strong{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:flex;gap:8px;margin:12px 0}.field{width:100%;background:#0c1325;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;outline:none}.field:focus{border-color:#8267ff;box-shadow:0 0 0 3px #8267ff20}.search{flex:1;min-width:0}.btn{border-radius:12px;padding:12px 14px;font-weight:850;background:linear-gradient(110deg,var(--blue),var(--violet));color:white;box-shadow:0 6px 18px #5d63e633}.btn.secondary{background:#202b45;box-shadow:none;border:1px solid var(--line)}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;background:linear-gradient(145deg,#141d32,#101729);border:1px solid var(--line);border-radius:16px;padding:10px}.thumb{width:64px;height:64px;border-radius:11px;object-fit:cover;background:#202a43;flex-shrink:0}.main{min-width:0;flex:1}.name{font-weight:850;line-height:1.3;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:5px}.price{font-weight:900;color:#b9a4ff;margin-top:4px}.edit{background:#24365a;color:#dce9ff;border:1px solid #3a5688;border-radius:10px;padding:9px 11px;font-weight:800}.green{color:#4cdda6}.red{color:#ff9eaa}.empty,.loading{text-align:center;color:var(--muted);padding:30px 10px}.modal{position:fixed;inset:0;background:#050816df;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:10px}.modal.show{display:flex}.sheet{width:min(100%,700px);max-height:94vh;overflow:auto;background:#111a2e;border:1px solid #344365;border-radius:22px;padding:17px 15px calc(18px + env(safe-area-inset-bottom));box-shadow:0 20px 80px #0009}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet h2{font-size:18px;margin:0}.x{background:#27324b;color:#fff;border-radius:10px;padding:8px 11px}.group{margin:12px 0}.group label{display:block;color:#aebbd6;font-size:11px;font-weight:800;margin:0 0 7px}.area{min-height:105px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.preview{width:100%;height:145px;object-fit:contain;background:#0a1020;border:1px dashed #405071;border-radius:13px;margin-top:8px}.check{display:flex;align-items:center;gap:9px;color:#d8e0f4;font-size:13px}.check input{width:18px;height:18px;accent-color:#8a6cff}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#253958;border:1px solid #526c9b;border-radius:13px;padding:11px 15px;z-index:10;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.modal{align-items:center}.sheet{max-height:88vh}.thumb{width:76px;height:76px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="brand">KARY <b>STORE</b></div><div class="sub">Панель управления каталогом</div></div><span class="pill">● ADMIN</span></header><div class="stats"><div class="stat"><strong id="total">—</strong><span>Всего товаров</span></div><div class="stat"><strong id="active">—</strong><span>Опубликовано</span></div><div class="stat"><strong id="cats">—</strong><span>Категорий</span></div></div><div class="toolbar"><input id="search" class="field search" placeholder="Поиск товара…"><button class="btn" id="add">＋ Добавить</button></div><div id="list" class="list"><div class="loading">Загружаем каталог…</div></div></div>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><h2 id="formTitle">Новый товар</h2><button class="x" id="close">✕</button></div><form id="form"><input type="hidden" id="pid"><div class="group"><label>Название товара</label><input class="field" id="name" required maxlength="180" placeholder="Название"></div><div class="group"><label>Описание</label><textarea class="field area" id="description" placeholder="Подробное описание товара"></textarea></div><div class="two"><div class="group"><label>Цена, ₽</label><input class="field" id="price" type="number" min="0" step=".01" required></div><div class="group"><label>Старая цена, ₽</label><input class="field" id="oldPrice" type="number" min="0" step=".01" placeholder="Необязательно"></div></div><div class="group"><label>Категория</label><select class="field" id="category" required></select></div><div class="group"><label>Фотография товара</label><input class="field" id="photo" type="file" accept="image/jpeg,image/png,image/webp"><input class="field" id="imageUrl" placeholder="Или ссылка на фото" style="margin-top:8px"><img id="preview" class="preview" alt="Предпросмотр" hidden><label class="check" style="margin-top:9px"><input id="clearPhoto" type="checkbox"> Удалить текущее фото</label></div><div class="group"><label class="check"><input id="published" type="checkbox" checked> Показывать товар в магазине</label></div><div class="actions"><button type="button" class="btn secondary" id="cancel">Отмена</button><button type="submit" class="btn" id="save">Сохранить</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const API="https://krdhfzbinbxyketfcrdg.supabase.co/functions/v1/kary-miniapp-admin";const initData=tg?.initData||"";let products=[],categories=[],selectedFile=null;const $=id=>document.getElementById(id);
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)}
async function call(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData,action,...extra})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Ошибка запроса");return j}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function catName(id){return categories.find(c=>+c.id===+id)?.name||"Без категории"}
function render(){let q=$("search").value.toLowerCase().trim(),arr=products.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q));$("total").textContent=products.length;$("active").textContent=products.filter(p=>p.is_active).length;$("cats").textContent=categories.length;$("list").innerHTML=arr.length?arr.map(p=>'<article class="item"><img class="thumb" src="'+esc(p.image_url||"")+'" onerror="this.style.visibility=\'hidden\'" alt=""><div class="main"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(catName(p.category_id))+' · <span class="'+(p.is_active?"green":"red")+'">'+(p.is_active?"Опубликован":"Скрыт")+'</span></div><div class="price">'+Number(p.price).toLocaleString("ru-RU")+' ₽</div></div><button class="edit" data-edit="'+p.id+'">Изменить</button></article>').join(""):'<div class="empty">Ничего не найдено</div>'}
function openForm(p=null){$("formTitle").textContent=p?"Редактирование товара #"+p.id:"Новый товар";$("pid").value=p?.id||"";$("name").value=p?.name||"";$("description").value=p?.description||"";$("price").value=p?.price??"";$("oldPrice").value=p?.original_price??"";$("category").innerHTML=categories.filter(c=>c.is_active).map(c=>'<option value="'+c.id+'">'+esc(c.icon+" "+c.name)+'</option>').join("");$("category").value=p?.category_id||categories.find(c=>c.is_active)?.id||"";$("imageUrl").value=p?.image_url||"";$("published").checked=p?.is_active??true;$("photo").value="";selectedFile=null;$("clearPhoto").checked=false;$("preview").hidden=!p?.image_url;$("preview").src=p?.image_url||"";$("modal").classList.add("show")}
function closeForm(){$("modal").classList.remove("show")}
$("list").addEventListener("click",e=>{let b=e.target.closest("[data-edit]");if(b)openForm(products.find(p=>String(p.id)===b.dataset.edit))});$("add").onclick=()=>openForm();$("close").onclick=$("cancel").onclick=closeForm;$("search").oninput=render;
$("photo").onchange=()=>{selectedFile=$("photo").files[0]||null;if(selectedFile){$("preview").src=URL.createObjectURL(selectedFile);$("preview").hidden=false}};$("imageUrl").oninput=()=>{if(!$("photo").files.length&&$("imageUrl").value){$("preview").src=$("imageUrl").value;$("preview").hidden=false}};
function fileData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$("form").onsubmit=async e=>{e.preventDefault();let b=$("save");b.disabled=true;b.textContent="Сохраняем…";try{let p={id:$("pid").value||null,name:$("name").value,description:$("description").value,price:$("price").value,original_price:$("oldPrice").value||null,category_id:$("category").value,image_url:$("clearPhoto").checked?null:$("imageUrl").value,is_active:$("published").checked};if(selectedFile)p.image_data=await fileData(selectedFile);await call("save",{product:p});closeForm();await load();toast("Изменения сохранены ✓")}catch(err){toast(err.message)}finally{b.disabled=false;b.textContent="Сохранить"}};
async function load(){try{let d=await call("list");products=d.products||[];categories=d.categories||[];render()}catch(e){$("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>';toast(e.message)}}load();
</script></body></html>
